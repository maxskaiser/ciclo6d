<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Alma de Servo - Levantamento de Dons</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f4f8; color: #2c3e50; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .quiz-container { background-color: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 35px; max-width: 650px; width: 100%; }
        .progress-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; font-size: 0.9rem; color: #7f8c8d; }
        .progress-bar { height: 8px; background-color: #e2e8f0; border-radius: 4px; width: 75%; overflow: hidden; }
        .progress-fill { height: 100%; background-color: #2c3e50; width: 0%; transition: width 0.3s ease; }
        .question { font-size: 1.25rem; margin-bottom: 25px; font-weight: 600; line-height: 1.5; color: #1a252f; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background-color: #fff; border: 2px solid #cbd5e1; border-radius: 8px; padding: 14px 20px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; }
        .option-btn:hover { background-color: #f0f7ff; border-color: #2c3e50; color: #2c3e50; }
        .option-badge { background-color: #e2e8f0; border-radius: 4px; padding: 2px 8px; margin-right: 12px; font-weight: bold; font-size: 0.85rem; display: inline-block; min-width: 15px; text-align: center; }
        .option-btn:hover .option-badge { background-color: #2c3e50; color: white; }
        .result-screen { display: none; text-align: center; }
        .skills-grid { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; text-align: left; }
        .skill-card { background: #f8fafc; border: 1px solid #e2e8f0; border-left: 6px solid #27ae60; padding: 16px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .skill-rank { font-size: 1.5rem; font-weight: bold; color: #27ae60; margin-right: 15px; }
        .skill-info { display: flex; align-items: center; }
        .skill-name { font-weight: bold; font-size: 1.1rem; color: #2c3e50; }
        .skill-points { font-size: 1.2rem; color: #27ae60; font-weight: 700; background: #e8f8f0; padding: 4px 14px; border-radius: 20px; }
            .option-btn:focus-visible { outline: 3px solid #3498db; outline-offset: 2px; }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .quiz-container { padding: 20px; }
        }
    </style>
</head>

		const scaleOptions = [
			{ label: "Sempre", value: 4 },
			{ label: "Frequentemente / Na maioria das vezes", value: 3 },

			{ label: "Raramente", value: 1 },

			let currentQuestionIndex = 0;
			let scoresBySkill = {};
			questions.forEach(q => { if (!scoresBySkill[q.skill]) scoresBySkill[q.skill] = 0; });
            let scormActive = false;
            function initSCORM() { return false; }
					
			function loadQuestion() {
    if (currentQuestionIndex >= questions.length) {
        finishQuiz();
        return;
    }
    
    const currentQuestion = questions[currentQuestionIndex];
    
    // Corrigido: Adicionadas as crases para permitir o uso de \${}
    document.getElementById("progress-text").innerText = `Afirmação ${currentQuestionIndex + 1} de ${questions.length}`;
    
    // Corrigido: Adicionadas as crases envolvendo o cálculo e o símbolo de %
    document.getElementById("progress").style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
    
    // Corrigido: Adicionadas as crases para juntar o ID da pergunta com o texto
    document.getElementById("question-text").innerText = `${currentQuestion.id}. ${currentQuestion.text}`;
    
    const container = document.getElementById("options-container");
    container.innerHTML = "";
    
    scaleOptions.forEach(opt => {
        const button = document.createElement("button");
        button.className = "option-btn";
        button.type = "button";
        
        // Corrigido: Adicionadas as crases para injetar a tag HTML e as variáveis corretamente
        button.innerHTML = `<span class="option-badge">${opt.value}</span> ${opt.label}`;
        
        button.onclick = () => handleAnswer(currentQuestion.skill, opt.value);
        container.appendChild(button);
    });
    
    window.scrollTo(0,0);
}

			
			function handleAnswer(skill, val) {
				scoresBySkill[skill] += val;
				currentQuestionIndex++;
				loadQuestion();
			}//final handleAnswer
			
			function finishQuiz() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    
    // Cria a string completa de log com TODOS os dons para os administradores no EadSimples
    let reportString = "Levantamento Completo de Dons: ";
    for (const s in scoresBySkill) {
        // Corrigido: Adicionadas as crases para estruturar o texto do log
        reportString += `[${s}: ${scoresBySkill[s]} pts] `;
    }
    
    // Corrigido: Linha isolada corretamente (separada do comentário anterior)
    let sortedSkills = [];
    for (const skill in scoresBySkill) {
        sortedSkills.push({ name: skill, points: scoresBySkill[skill] });
    }
    
    // Ordena do maior para o menor
    sortedSkills.sort((a, b) => b.points - a.points);
    
    // Pega estritamente os 3 principais dons para renderizar na tela do estudante
    const topThree = sortedSkills.slice(0, 3);
    const breakdownContainer = document.getElementById("skills-breakdown");
    
    topThree.forEach((skill, index) => {
        const card = document.createElement("div");
        card.className = "skill-card"; 
        
        // Corrigido: Adicionadas as crases envolvendo todo o bloco de HTML multilinha
        card.innerHTML = `
            <div class="skill-info"> 
                <span class="skill-rank">${index + 1}º</span> 
                <span class="skill-name">${skill.name}</span> 
            </div> 
            <div class="skill-points">${skill.points} / 20</div>
        `;
        breakdownContainer.appendChild(card);
    });
    
    // HTML5 puro: guarda o resultado localmente no navegador.
    try {
        const totalScore = Object.values(scoresBySkill).reduce((a, b) => a + b, 0);
        localStorage.setItem("alma-de-servo-resultado", JSON.stringify({
            completedAt: new Date().toISOString(),
            scores: scoresBySkill,
            totalScore: totalScore,
            report: reportString
        }));
    } catch (e) {
        console.warn("Não foi possível salvar o resultado localmente.", e);
    }
}

document.getElementById("restart-btn").onclick = function() {
    currentQuestionIndex = 0;
    Object.keys(scoresBySkill).forEach(skill => { scoresBySkill[skill] = 0; });
    document.getElementById("skills-breakdown").innerHTML = "";
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    loadQuestion();
};

window.onload = function() {
    loadQuestion();
};

</script>
